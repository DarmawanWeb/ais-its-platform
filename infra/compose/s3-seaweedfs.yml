# =============================================================================
# Fallback S3: replace RustFS by SeaweedFS (same ports, keys and buckets)
# =============================================================================
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/s3-seaweedfs.yml up -d --wait
#
# Use it if RustFS misbehaves on your machine. Services keep their S3_* settings
# (path-style, region us-east-1). SeaweedFS has no web console on 9001.
# Switching backends does not migrate objects: run `down -v` or copy them first.
# =============================================================================
services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["mini", "-dir=/data", "-bucket=${S3_BUCKETS:-vessel-photos}"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-seemp-dev}       # admin identity of the S3 gateway
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-seemp-dev-secret}
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_API_PORT:-9000}:8333"
    post_start: !reset []                # buckets come from -bucket instead
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
