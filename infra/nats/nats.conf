# =============================================================================
# AIS Maritime Intelligence — NATS server configuration (local development)
# =============================================================================
# Client 4222 · monitoring 8222 · MQTT 1883 (docs/PLATFORM_SPEC.md §3, §7).
# Streams and consumers are NOT declared here: producers ensure the streams of
# contracts `STREAMS` on boot and consumers ensure their durables (spec §7.2).
# This file enables the engines and bounds their resources.

# A stable server name is mandatory for the MQTT gateway (and for JetStream
# clustering later); MQTT also requires JetStream, see below.
server_name: aisits-nats-dev

port: 4222
http_port: 8222        # /healthz, /varz, /jsz, /connz … (not exposed outside dev)

# Largest message a client may publish (default 1MB). A full AIS batch —
# ≤ 1000 positions per POST /ingest/ais, ~0.5 MB once wrapped in event
# envelopes — fits with headroom; NATS advises staying at or below 8MB.
max_payload: 4MB

jetstream {
  store_dir: /data             # named volume aisits_nats-data (NATS adds /jetstream)
  # Hard caps for a developer machine. Streams additionally carry their own
  # max_age (24 h … 90 d, spec §7.2); when a cap is reached publishes fail with
  # "insufficient resources" instead of silently filling the disk.
  max_memory_store: 256MB
  max_file_store: 8GB
}

# MQTT gateway for fuel-meter devices (spec §7.3, §13.4): an MQTT PUBLISH on
# topic aisits/telemetry/<deviceId> becomes a core NATS message on subject
# aisits.telemetry.<deviceId> ("/" ↔ "."), consumed by the telemetry service.
# QoS 1 sessions and retained messages are persisted in JetStream ($MQTT_* streams).
mqtt {
  port: 1883
  # DEV ONLY: no authentication or TLS — any client may connect and publish.
  #
  # PRODUCTION: devices authenticate as individual NATS users of a dedicated
  # DEVICES account (MQTT username/password, or a JWT/nkey via the operator
  # model), restricted to MQTT connections and to their own subject, e.g.
  #   { user: "dev-0001", password: "<bcrypt hash>",
  #     allowed_connection_types: ["MQTT"],
  #     permissions: { publish: { allow: ["aisits.telemetry.dev-0001"] },
  #                    subscribe: { deny: [">"] } } }
  # The account exports "aisits.telemetry.>" and the AISITS account imports
  # it, so devices never share an account with the services. Revoking a device
  # = removing its user (or JWT). Listen on 8883 with TLS (see below).
}

