# =============================================================================
# AIS Maritime Intelligence gateway — dynamic configuration (routes of
# docs/PLATFORM_SPEC.md §12)
# =============================================================================
# One table for both local modes; only the upstream URLs differ (bottom of the
# file), selected by the gateway container's AISITS_GATEWAY_UPSTREAMS
# (compose: GATEWAY_UPSTREAMS in infra/compose/.env):
#   host  (default) services and the Vite dev server run on the host
#                   (`pnpm dev`) and are reached through host.docker.internal
#                   on their §3 ports (listen on 0.0.0.0; Vite with `--host`)
#   stack           every backend is a compose service on the `aisits`
#                   network, reached by its §3 hostname; the web image is nginx
#                   serving the built SPA on :8080
# Martin and the MVP API are compose services in both modes.
# Traefik renders this file as a Go template (sprig functions) on every load.
#
# Production uses the same routers from infra/helm/ais-its-platform/values.yaml
# (gateway.routes) — keep both in sync; infra/scripts/routes-test.sh checks
# this table end to end.
#
# Router conventions (one router per §12 row):
#   name      = backend name, `<backend>-<purpose>` for sub-routes
#   rule      = PathPrefix(`…`) per prefix of the §12 row, joined with ||
#   priority  = 1000 blocked paths · 300 sub-routes needing other middlewares
#               · 200 §12 rows · 1 the "/" catch-all (higher wins)
#   middlewares, in order: security-headers, [route specific], compress
# =============================================================================
{{- $mode := env "AISITS_GATEWAY_UPSTREAMS" | default "host" }}
{{- if not (has $mode (list "host" "stack")) }}
{{- fail (printf "AISITS_GATEWAY_UPSTREAMS must be host or stack, not %q" $mode) }}
{{- end }}
{{- $stack := eq $mode "stack" }}
{{- /* Platform services and their §3 ports; host mode reaches all of them on the host. */}}
{{- $ports := dict "auth" 3001 "fleet" 3002 "ais-ingestor" 3003 "ais-processor" 3004 "telemetry" 3005
      "emission" 3006 "surveillance" 3007 "notification" 3008 "geo" 3009 "safety" 3011 }}

http:
  routers:
    # --- never exposed through the gateway (spec §5, §12) --------------------
    blocked:
      entryPoints: [web]
      rule: "PathPrefix(`/internal`) || Path(`/metrics`) || PathPrefix(`/docs`) || Path(`/openapi.json`)"
      priority: 1000
      middlewares: [deny-all]
      service: noop@internal

    # --- auth:3001 ----------------------------------------------------------
    auth-throttled:            # anonymous credential endpoints: strict per-IP limit
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/auth/login`) || PathPrefix(`/api/v2/auth/password`) || PathPrefix(`/api/v2/auth/mfa/verify`)"
      priority: 300
      middlewares: [security-headers, auth-rate-limit, compress]
      service: auth
    auth-session:              # anonymous session endpoints (cookie / bearer): looser per-IP limit
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/auth/refresh`) || PathPrefix(`/api/v2/auth/logout`) || PathPrefix(`/api/v2/auth/verify`)"
      priority: 300
      middlewares: [security-headers, session-rate-limit, compress]
      service: auth
    auth:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/auth`) || PathPrefix(`/api/v2/me`) || PathPrefix(`/api/v2/users`) || PathPrefix(`/api/v2/organizations`) || PathPrefix(`/api/v2/api-keys`) || PathPrefix(`/api/v2/audit-logs`) || Path(`/.well-known/jwks.json`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: auth

    # --- fleet:3002 ---------------------------------------------------------
    fleet:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/vessels`) || PathPrefix(`/api/v2/vessel-types`) || PathPrefix(`/api/v2/fuels`) || PathPrefix(`/api/v2/engines`) || PathPrefix(`/api/v2/fuel-formulas`) || PathPrefix(`/api/v2/ports`) || PathPrefix(`/api/v2/registry`) || PathPrefix(`/api/v2/fleet`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: fleet

    # --- ais-ingestor:3003 ----------------------------------------------------
    ais-ingestor-socket:       # socket.io for AIS pushers (WebSocket + long-polling)
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/ingest/socket`)"
      priority: 300
      middlewares: [security-headers]
      service: ais-ingestor
    ais-ingestor:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/ingest`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: ais-ingestor

    # --- ais-processor:3004 ---------------------------------------------------
    ais-processor:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/ais`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: ais-processor

    # --- telemetry:3005 -------------------------------------------------------
    telemetry:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/telemetry`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: telemetry

    # --- emission:3006 --------------------------------------------------------
    emission:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/cii`) || PathPrefix(`/api/v2/seemp`) || PathPrefix(`/api/v2/emission`) || PathPrefix(`/api/v2/reduction-factors`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: emission

    # --- surveillance:3007 ----------------------------------------------------
    surveillance:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/surveillance`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: surveillance

    # --- notification:3008 ----------------------------------------------------
    notification-ws:           # socket.io realtime gateway (spec §9)
      entryPoints: [web]
      rule: "PathPrefix(`/ws`)"
      priority: 300
      middlewares: [security-headers]
      service: notification
    notification:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/alerts`) || PathPrefix(`/api/v2/alert-rules`) || PathPrefix(`/api/v2/notifications`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: notification

    # --- geo:3009 -------------------------------------------------------------
    geo:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/zones`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: geo

    # --- safety:3011 ----------------------------------------------------------
    safety:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v2/safety`)"
      priority: 200
      middlewares: [security-headers, compress]
      service: safety

    # --- martin:3010 (compose profile "tiles"), only for signed-in users -----
    # Martin has no authentication of its own, so a *_tiles view may only hold
    # rows that every signed-in user may see (spec §6, §8.5). The web app sends
    # the access token with MapLibre's transformRequest.
    tiles:
      entryPoints: [web]
      rule: "PathPrefix(`/tiles`)"
      priority: 200
      middlewares: [security-headers, forward-auth, strip-tiles-prefix, compress]
      service: martin

    # --- legacy-be:3020 (compose profile "legacy"), only for signed-in users --
    legacy:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1`)"
      priority: 200
      middlewares: [security-headers, strip-identity-headers, forward-auth, compress]
      service: legacy-be

    # --- web (SPA: Vite dev server incl. its HMR WebSocket, or nginx) ---------
    web:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      priority: 1
      middlewares: [security-headers, compress]
      service: web
      # Not access-logged: links from e-mails land here (password reset and
      # invites, spec §13.1) and their query strings must never reach a log.
      observability:
        accessLogs: false

  middlewares:
    # 403 for everyone: only loopback inside the gateway container is allowed,
    # which no client coming through the published port can be.
    deny-all:
      ipAllowList:
        sourceRange: ["127.0.0.1/32", "::1/128"]

    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true                        # X-Frame-Options: DENY
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), payment=(), usb=()"
        customResponseHeaders:                 # empty value = remove banner headers
          Server: ""
          X-Powered-By: ""
        # HSTS is only meaningful over HTTPS: enabled in the production IngressRoute.

    # Gateway-level limits for anonymous endpoints (spec §5), per client IP;
    # auth adds per-account login throttling in Valkey (spec §13.1).
    auth-rate-limit:                           # login, password reset, MFA verify
      rateLimit:
        average: 30
        period: 1m
        burst: 30
    session-rate-limit:                        # refresh, logout, verify: every tab
      rateLimit:                               # refreshes, offices share one IP
        average: 120
        period: 1m
        burst: 60

    compress:
      compress:
        minResponseBodyBytes: 1024
        excludedContentTypes: [text/event-stream]

    strip-tiles-prefix:
      stripPrefix:
        prefixes: ["/tiles"]

    # Identity headers are only ever set by forward-auth below; drop spoofed ones.
    strip-identity-headers:
      headers:
        customRequestHeaders:
          X-User-Id: ""
          X-Org-Id: ""
          X-Roles: ""

    # Requires a valid v2 access token: auth answers 200 + identity headers
    # (forwarded to the backend) or 401 (returned to the client).
    forward-auth:
      forwardAuth:
        address: "http://{{ if $stack }}auth{{ else }}host.docker.internal{{ end }}:{{ index $ports "auth" }}/api/v2/auth/verify"
        authRequestHeaders: [Authorization, X-Request-Id]
        authResponseHeaders: [X-User-Id, X-Org-Id, X-Roles]

  # --- upstreams (the only part that differs between host and stack mode) -----
  services:
{{- range $name, $port := $ports }}
    {{ $name }}:
      loadBalancer:
        servers: [{ url: "http://{{ if $stack }}{{ $name }}{{ else }}host.docker.internal{{ end }}:{{ $port }}" }]
{{- end }}
    web:
      loadBalancer:
        servers: [{ url: "{{ if $stack }}http://web:8080{{ else }}http://host.docker.internal:5173{{ end }}" }]
    martin:
      loadBalancer:
        servers: [{ url: "http://martin:3010" }]
    legacy-be:
      loadBalancer:
        servers: [{ url: "http://legacy-be:3020" }]
