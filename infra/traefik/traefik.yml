# =============================================================================
# AIS Maritime Intelligence gateway — Traefik v3 static configuration (local)
# =============================================================================
# Routes live in the dynamic configuration mounted at /etc/traefik/dynamic
# (infra/traefik/dynamic/routes.yml): backends on the host (`pnpm dev`) by
# default, compose services with AISITS_GATEWAY_UPSTREAMS=stack.
# Production uses Kubernetes IngressRoutes instead (infra/helm/ais-its-platform).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":8000"
    # Client-supplied X-Forwarded-* headers are discarded (Traefik default) —
    # the gateway is the edge in dev. Behind a load balancer, trust only it:
    # forwardedHeaders: { trustedIPs: ["10.0.0.0/8"] }
    transport:
      respondingTimeouts:
        readTimeout: 60s     # whole request incl. body (photo uploads ≤ 5 MB)
        idleTimeout: 180s    # keep-alive between requests
  traefik:
    address: ":8090"         # dashboard/API (dev), /ping and /metrics — never public

api:
  dashboard: true
  # DEV ONLY: dashboard and API served unauthenticated on the `traefik`
  # entrypoint. In production the API is not exposed (or only through a router
  # with authentication on an internal entrypoint).
  insecure: true

ping:
  entryPoint: traefik        # used by `traefik healthcheck --ping`

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true              # edit a route, it is live without a restart

log:
  level: INFO
  format: json

# JSON access log. Request headers are dropped (Authorization, cookies,
# X-API-Key) except the three below. RequestPath keeps the query string, so no
# API may accept a secret there (tokens and API keys travel in headers, spec
# §8.1; MapLibre sends the token with transformRequest); the `web` router,
# which receives the links of reset/invite e-mails (§13.1), is not logged at
# all (observability.accessLogs: false in dynamic/routes.yml).
accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Content-Type: keep
        X-Request-Id: keep

# Scraped by the observability collector (infra/observability/otelcol-aisits.yaml).
metrics:
  prometheus:
    entryPoint: traefik
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

# Root spans for every request; the W3C traceparent header is propagated to the
# services, whose OpenTelemetry SDKs continue the trace (spec §10).
tracing:
  serviceName: aisits-gateway
  sampleRate: 1.0            # dev: sample everything
  otlp:
    http:
      endpoint: http://observability:4318/v1/traces
