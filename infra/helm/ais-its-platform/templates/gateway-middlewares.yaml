{{- /*
  Middlewares referenced by the route table — same semantics as the dev
  gateway (infra/traefik/dynamic/routes.yml), plus HSTS for HTTPS.
*/ -}}
{{- if .Values.gateway.enabled }}
{{- $gw := .Values.gateway }}
# 403 for everyone: only Traefik's own loopback is allowed (spec §12 hidden paths).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ais-its-platform.middleware" (list . "deny-all") }}
  labels:
    {{- include "ais-its-platform.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange: ["127.0.0.1/32", "::1/128"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ais-its-platform.middleware" (list . "security-headers") }}
  labels:
    {{- include "ais-its-platform.labels" . | nindent 4 }}
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), payment=(), usb=()"
    {{- if and $gw.tls.enabled $gw.hsts.enabled }}
    stsSeconds: {{ int $gw.hsts.maxAgeSeconds }}
    stsIncludeSubdomains: true
    {{- end }}
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
---
{{- /* Per-IP limits of the anonymous endpoints (spec §5): credentials, sessions. */}}
{{- range $name, $limit := dict "auth-rate-limit" $gw.rateLimit "session-rate-limit" $gw.sessionRateLimit }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ais-its-platform.middleware" (list $ $name) }}
  labels:
    {{- include "ais-its-platform.labels" $ | nindent 4 }}
spec:
  rateLimit:
    average: {{ int $limit.average }}
    period: {{ $limit.period }}
    burst: {{ int $limit.burst }}
    {{- with $gw.rateLimit.ipStrategyDepth }}
    sourceCriterion:
      ipStrategy:
        depth: {{ int . }}
    {{- end }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ais-its-platform.middleware" (list . "compress") }}
  labels:
    {{- include "ais-its-platform.labels" . | nindent 4 }}
spec:
  compress:
    minResponseBodyBytes: 1024
    excludedContentTypes: [text/event-stream]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ais-its-platform.middleware" (list . "strip-tiles-prefix") }}
  labels:
    {{- include "ais-its-platform.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes: ["/tiles"]
---
# Identity headers may only come from forward-auth; drop client-supplied ones.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ais-its-platform.middleware" (list . "strip-identity-headers") }}
  labels:
    {{- include "ais-its-platform.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      X-User-Id: ""
      X-Org-Id: ""
      X-Roles: ""
---
# /api/v1 and /tiles need a valid v2 access token (auth answers 200 + identity headers or 401).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ais-its-platform.middleware" (list . "forward-auth") }}
  labels:
    {{- include "ais-its-platform.labels" . | nindent 4 }}
spec:
  forwardAuth:
    {{- $auth := index .Values "auth" }}
    address: {{ $gw.forwardAuthAddress | default (printf "http://%s.%s.svc.cluster.local:%v/api/v2/auth/verify" ($auth.fullnameOverride | default "auth") .Release.Namespace (int $auth.port)) | quote }}
    authRequestHeaders: [Authorization, X-Request-Id]
    authResponseHeaders: [X-User-Id, X-Org-Id, X-Roles]
{{- end }}
