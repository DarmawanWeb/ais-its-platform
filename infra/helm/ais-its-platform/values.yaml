# =============================================================================
# ais-its-platform — base values (environment-neutral)
# =============================================================================
# Layer an environment file on top:
#   helm upgrade --install ais-its infra/helm/ais-its-platform -n ais-its -f values-prod.yaml
#
# Every process is an instance of ../ais-its-service (see its values.yaml for
# all knobs). fullnameOverride = spec §3 hostname, so in-cluster URLs are the
# same as in the compose stack (http://auth:3001 …). Secrets are referenced by
# name (existingSecret) and are never stored in these files.

global:
  # -- Release tag applied to every platform image without an explicit image.tag.
  imageTag: ""
  imagePullSecrets: []
  # -- Secret with variables shared by all services (INTERNAL_TOKEN).
  existingSecret: ais-its-shared
  # -- Common environment (spec §4); in-cluster hostnames of the backing services.
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    LOG_PRETTY: "false"
    DATABASE_POOL_MAX: "10"
    DB_MIGRATE_ON_BOOT: "true"
    # The external NATS (JetStream, >= 2.11) MUST allow max_payload >= 4MB like
    # infra/nats/nats.conf: services log a warning at connect when it is lower and
    # refuse to publish larger messages (zone snapshots reach ~1.5 MB).
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://valkey:6379
    AUTH_JWKS_URL: http://auth:3001/.well-known/jwks.json
    AUTH_ISSUER: ais-its-auth
    AUTH_AUDIENCE: ais-its-api
    AUTH_INTERNAL_URL: http://auth:3001
    CORS_ORIGINS: https://ais-its.example.com
    # X-Forwarded-For is trusted only from TRUSTED_PROXIES; in production set it to
    # the gateway (Traefik) Pods' address range only, e.g. "10.42.0.0/16" (spec §4).
    # The default (loopback and private networks) logs a warning at boot.
    # TRUSTED_PROXIES: 10.42.0.0/16
    PUBLIC_BASE_URL: https://ais-its.example.com
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

# --- auth:3001 (spec §13.1) --------------------------------------------------
auth:
  enabled: true
  fullnameOverride: auth
  image:
    repository: ghcr.io/darmawanweb/ais-its-auth-service
  port: 3001
  env:
    DATABASE_SCHEMA: auth
    ACCESS_TOKEN_TTL: "900"
    REFRESH_TOKEN_TTL_DAYS: "30"
    COOKIE_SECURE: "true"
    BOOTSTRAP_ADMIN_EMAIL: admin@ais-its.local
  # DATABASE_URL, KEY_ENCRYPTION_SECRET, BOOTSTRAP_ADMIN_PASSWORD
  existingSecret: ais-its-auth

# --- fleet:3002 (spec §13.3) -------------------------------------------------
fleet:
  enabled: true
  fullnameOverride: fleet
  image:
    repository: ghcr.io/darmawanweb/ais-its-fleet-service
  port: 3002
  env:
    DATABASE_SCHEMA: fleet
    S3_ENDPOINT: http://s3:9000
    S3_REGION: us-east-1
    S3_BUCKET_PHOTOS: vessel-photos
    S3_FORCE_PATH_STYLE: "true"
    S3_PUBLIC_ENDPOINT: https://s3.ais-its.example.com
    FLEET_REPUBLISH_ON_BOOT: "false"
  # DATABASE_URL, S3_ACCESS_KEY, S3_SECRET_KEY
  existingSecret: ais-its-fleet

# --- ais-ingestor:3003 and ais-processor:3004 — one image, two processes (§13.2)
ais-ingestor:
  enabled: true
  fullnameOverride: ais-ingestor
  image:
    repository: ghcr.io/darmawanweb/ais-its-pipeline
  command: ["node", "dist/apps/ingestor/main.js"]
  port: 3003
  # Stateless: the pusher socket and POST /ingest/ais scale horizontally
  # (duplicates are dropped by Nats-Msg-Id). Every replica also connects to each
  # upstream whose URL is set, with the same AIS_UPSTREAM_TOKEN, and the replicas
  # of one Deployment share these values: with a feed URL set, run ONE replica
  # (one connection per upstream account, ais-pipeline README "Scaling"). The
  # render fails otherwise (templates/checks.yaml; it reads env and secretEnv).
  env:
    SERVICE_NAME: ais-ingestor
    AIS_PRIMARY_URL: ""          # empty = upstream disabled
    AIS_BATAM_URL: ""
  # AIS_UPSTREAM_TOKEN (stateless: no database)
  existingSecret: ais-its-ais-ingestor

ais-processor:
  enabled: true
  fullnameOverride: ais-processor
  image:
    repository: ghcr.io/darmawanweb/ais-its-pipeline
  command: ["node", "dist/apps/processor/main.js"]
  port: 3004
  # The AIS_RAW consumer "ais-processor" is exclusive (NATS >= 2.11 pinned
  # client): one active replica keeps per-vessel order, others are hot
  # standbys. A graceful stop releases the pin, so rolling updates hand over at
  # once; a crashed active replica is replaced after the 30 s pin TTL. The query
  # API, the outbox relay and the traffic sampler run on every replica.
  env:
    SERVICE_NAME: ais-processor
    DATABASE_SCHEMA: ais
    AIS_DEDUP_MIN_DISTANCE_M: "0.1"
    PROCESSOR_BATCH_SIZE: "500"
    PROCESSOR_FLUSH_MS: "1000"
  # DATABASE_URL
  existingSecret: ais-its-ais-processor

# --- telemetry:3005 (spec §13.4) ---------------------------------------------
telemetry:
  enabled: true
  fullnameOverride: telemetry
  image:
    repository: ghcr.io/darmawanweb/ais-its-telemetry-service
  port: 3005
  env:
    DATABASE_SCHEMA: telemetry
    TELEMETRY_ACTIVE_WINDOW_MIN: "10"
  # DATABASE_URL
  existingSecret: ais-its-telemetry

# --- emission:3006 (spec §13.5) ----------------------------------------------
emission:
  enabled: true
  fullnameOverride: emission
  image:
    repository: ghcr.io/darmawanweb/ais-its-emission-service
  port: 3006
  # Any number of replicas, rolling updates. The first 0.2.0 replica started on
  # a 0.1.0-release database applies 0004/0005 at boot and opens its port only
  # once 0005 has materialized the whole CII history: 30 min startup budget, and
  # a progress deadline above it. That upgrade also needs Recreate once
  # (infra/helm/README.md, "Upgrading from the 0.1.0 release").
  probes:
    startup:
      failureThreshold: 360        # × 5 s = 30 min
  progressDeadlineSeconds: 2100
  env:
    DATABASE_SCHEMA: emission
    CII_PUBLISH_INTERVAL_S: "60"
  # DATABASE_URL
  existingSecret: ais-its-emission

# --- geo:3009, zones / geofences (spec §13.6) --------------------------------
geo:
  enabled: true
  fullnameOverride: geo
  image:
    repository: ghcr.io/darmawanweb/ais-its-geo-service
  port: 3009
  env:
    DATABASE_SCHEMA: geo
  # DATABASE_URL
  existingSecret: ais-its-geo

# --- safety:3011, navigational safety detectors (spec §13.7, §18) ------------
safety:
  enabled: true
  fullnameOverride: safety
  image:
    repository: ghcr.io/darmawanweb/ais-its-safety-service
  port: 3011
  # Detectors keep per-vessel state in memory, so positions go to one active
  # instance per durable ("safety-positions", exclusive, NATS >= 2.11); further
  # replicas are hot standbys (failover, not throughput). The new active
  # instance reloads the open alerts before its first position and a stopping
  # Pod releases its pin at once: RollingUpdate, no Recreate (spec §13.7, §18).
  env:
    DATABASE_SCHEMA: safety
    DETECTORS: ews,collision
    EWS_DANGER_M: "500"
    EWS_WARNING_M: "1750"
    SAFETY_STATE_HEARTBEAT_S: "300"
    COLLISION_SEARCH_RADIUS_NM: "6"
  # DATABASE_URL
  existingSecret: ais-its-safety

# --- surveillance:3007, illegal-activity detectors (spec §13.8, §18) ---------
surveillance:
  enabled: true
  fullnameOverride: surveillance
  image:
    repository: ghcr.io/darmawanweb/ais-its-surveillance-service
  port: 3007
  # Streaks, track buffers and transhipment pairs live in memory: one active
  # instance per durable ("surveillance-positions"), hot standbys and rolling
  # updates as for safety; the dark scan and the transhipment analyser run on
  # the active instance only (spec §13.8).
  env:
    DATABASE_SCHEMA: surveillance
    DETECTORS: transhipment,anomaly,dark,geofence,fishing
    ANOMALY_MIN_POSITIONS: "3"
    DARK_GAP_MIN: "30"
  # DATABASE_URL
  existingSecret: ais-its-surveillance

# --- notification:3008, HTTP + socket.io /ws (spec §13.9, §9) ------------------
notification:
  enabled: true
  fullnameOverride: notification
  image:
    repository: ghcr.io/darmawanweb/ais-its-notification-service
  port: 3008
  # Scales horizontally: the durables and the delivery worker share the work,
  # alert pushes reach every replica's sockets over the core NATS fan-out
  # aisits.notification.realtime.v1, and the gateway's sticky cookie keeps
  # long-polling clients on one replica (spec §9, §13.9).
  env:
    DATABASE_SCHEMA: notify
    SMTP_FROM: "AIS Maritime Intelligence <no-reply@ais-its.example.com>"
  # DATABASE_URL, SMTP_URL, TELEGRAM_BOT_TOKEN, WEBHOOK_SIGNING_SECRET
  existingSecret: ais-its-notification

# --- web: nginx serving the built SPA on :8080 as non-root (spec §14) ----------
web:
  enabled: true
  fullnameOverride: web
  platformEnv: false
  image:
    repository: ghcr.io/darmawanweb/ais-its-web
    # Versioned on its own: pinned here so that neither global.imageTag (the
    # services' release) nor the chart appVersion picks its tag.
    tag: "0.1.0"                  # ais-its-web release
  port: 8080
  probes:
    liveness: { path: /, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
    readiness: { path: /, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
    startup: { enabled: false }
  metrics:
    enabled: false
  writablePaths: [/tmp, /var/cache/nginx, /var/run]
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# --- legacy-be:3020 — ais-its-mvp-api, /api/v1 until cut-over (spec §1, §12) ---
legacy-be:
  enabled: false                  # needs MongoDB; enable per environment
  fullnameOverride: legacy-be
  platformEnv: false
  image:
    repository: ghcr.io/darmawanweb/ais-its-mvp-api
    tag: "0.1.0"                  # image as deployed so far (versioned on its own, as web)
  port: 3020
  probes:
    liveness: { path: /, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
    readiness: { path: /, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
    startup: { path: /, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 24 }
  metrics:
    enabled: false
  env:
    WEBSOCKET_SERVER_PORT: "3021"
    TRUST_PROXY: "1"
    # Identity comes from the gateway's forwardAuth headers. Only safe because
    # the NetworkPolicy below admits nothing but the gateway.
    TRUST_FORWARD_AUTH: "true"
    # Browser origins allowed to write to /api/v1 (others get 403, also
    # same-origin writes through the gateway): the same list as the v2
    # services, so they cannot drift. Append MVP dashboard origins if needed.
    ALLOWED_ORIGINS: "{{ .Values.global.env.CORS_ORIGINS }}"
  # MONGO_URI, MONGO_DB_NAME, JWT_SECRET, REFRESH_TOKEN_SECRET; WEBSOCKET_URI,
  # WEBSOCKET_BATAM_URI, WEBSOCKET_TOKEN for the live AIS feed (infra/helm/README.md)
  existingSecret: ais-its-mvp-api
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# --- martin:3010 vector tiles, role tiles_ro (spec §3, §6) ---------------------
martin:
  enabled: true
  fullnameOverride: martin
  platformEnv: false
  image:
    repository: ghcr.io/maplibre/martin
    tag: "1.16.1"                 # bump deliberately (CLI flags below are version-specific)
    digest: sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
  port: 3010
  # --base-path: TileJSON advertises tile URLs under the gateway's /tiles prefix.
  args: ["--listen-addresses", "0.0.0.0:3010", "--pool-size", "10", "--base-path", "/tiles"]
  probes:
    liveness: { path: /health, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
    readiness: { path: /health, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
    startup: { enabled: false }
  metrics:
    enabled: false
  # DATABASE_URL=postgres://tiles_ro:…@<postgres>:5432/aisits
  existingSecret: ais-its-martin
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# =============================================================================
# Gateway — Traefik IngressRoute + Middlewares mirroring spec §12
# (requires Traefik v3 with its CRDs: traefik.io/v1alpha1).
# =============================================================================
gateway:
  enabled: true
  # -- Hostnames served; empty = any host.
  hosts: [ais-its.example.com]
  entryPoints: [websecure]
  tls:
    enabled: true
    # -- TLS secret in the release namespace (e.g. issued by cert-manager) …
    secretName: ais-its-tls
    # -- … or a Traefik ACME resolver (leave secretName empty).
    certResolver: ""
  hsts:
    enabled: true
    maxAgeSeconds: 31536000
  # -- Anonymous credential endpoints, per client IP (spec §5).
  rateLimit:
    average: 10
    period: 1m
    burst: 10
    # -- 0 = client address seen by Traefik; N = Nth address from the right of
    # X-Forwarded-For (set to 1 behind one trusted load balancer). Applies to
    # both rate limiters.
    ipStrategyDepth: 0
  # -- Anonymous session endpoints (refresh, logout, verify), per client IP:
  # looser, every browser tab refreshes its token and offices share one IP.
  sessionRateLimit:
    average: 120
    period: 1m
    burst: 60
  # -- Defaults to http://auth.<namespace>.svc.cluster.local:3001/api/v2/auth/verify
  forwardAuthAddress: ""
  # -- Cookie for sticky sessions on socket.io routes (long-polling needs the
  # same replica for a whole session).
  stickyCookieName: aisits_affinity

  # -- Route table: one entry per row of spec §12 plus sub-routes. `backend` is a
  # component alias above ("" = answered by the gateway itself; optional `port`
  # overrides the component's port); routes whose backend is disabled are
  # skipped. Middlewares are the names defined in templates/gateway-middlewares.yaml;
  # `accessLogs: false` keeps a route out of Traefik's access log.
  # Keep in sync with infra/traefik/dynamic/routes.yml.
  routes:
    - name: blocked
      priority: 1000
      prefixes: [/internal, /docs]
      paths: [/metrics, /openapi.json]
      backend: ""
      middlewares: [deny-all]
    - name: auth-throttled
      priority: 300
      prefixes: [/api/v2/auth/login, /api/v2/auth/password, /api/v2/auth/mfa/verify]
      backend: auth
      middlewares: [security-headers, auth-rate-limit, compress]
    - name: auth-session
      priority: 300
      prefixes: [/api/v2/auth/refresh, /api/v2/auth/logout, /api/v2/auth/verify]
      backend: auth
      middlewares: [security-headers, session-rate-limit, compress]
    - name: auth
      priority: 200
      prefixes: [/api/v2/auth, /api/v2/me, /api/v2/users, /api/v2/organizations, /api/v2/api-keys, /api/v2/audit-logs]
      paths: [/.well-known/jwks.json]
      backend: auth
      middlewares: [security-headers, compress]
    - name: fleet
      priority: 200
      prefixes: [/api/v2/vessels, /api/v2/vessel-types, /api/v2/fuels, /api/v2/engines, /api/v2/fuel-formulas, /api/v2/ports, /api/v2/registry, /api/v2/fleet]
      backend: fleet
      middlewares: [security-headers, compress]
    - name: ais-ingestor-socket
      priority: 300
      prefixes: [/api/v2/ingest/socket]
      backend: ais-ingestor
      sticky: true
      middlewares: [security-headers]
    - name: ais-ingestor
      priority: 200
      prefixes: [/api/v2/ingest]
      backend: ais-ingestor
      middlewares: [security-headers, compress]
    - name: ais-processor
      priority: 200
      prefixes: [/api/v2/ais]
      backend: ais-processor
      middlewares: [security-headers, compress]
    - name: telemetry
      priority: 200
      prefixes: [/api/v2/telemetry]
      backend: telemetry
      middlewares: [security-headers, compress]
    - name: emission
      priority: 200
      prefixes: [/api/v2/cii, /api/v2/seemp, /api/v2/emission, /api/v2/reduction-factors]
      backend: emission
      middlewares: [security-headers, compress]
    - name: surveillance
      priority: 200
      prefixes: [/api/v2/surveillance]
      backend: surveillance
      middlewares: [security-headers, compress]
    - name: notification-ws
      priority: 300
      prefixes: [/ws]
      backend: notification
      sticky: true
      middlewares: [security-headers]
    - name: notification
      priority: 200
      prefixes: [/api/v2/alerts, /api/v2/alert-rules, /api/v2/notifications]
      backend: notification
      middlewares: [security-headers, compress]
    - name: geo
      priority: 200
      prefixes: [/api/v2/zones]
      backend: geo
      middlewares: [security-headers, compress]
    - name: safety
      priority: 200
      prefixes: [/api/v2/safety]
      backend: safety
      middlewares: [security-headers, compress]
    - name: tiles                 # signed-in users only (spec §6, §12)
      priority: 200
      prefixes: [/tiles]
      backend: martin
      middlewares: [security-headers, forward-auth, strip-tiles-prefix, compress]
    - name: legacy
      priority: 200
      prefixes: [/api/v1]
      backend: legacy-be
      middlewares: [security-headers, strip-identity-headers, forward-auth, compress]
    - name: web
      priority: 1
      prefixes: [/]
      backend: web
      middlewares: [security-headers, compress]
      accessLogs: false           # e-mailed reset/invite links land here (spec §13.1)

# -- Restrict ingress to legacy-be (which trusts forwardAuth headers) to the
# gateway Pods only. Requires a CNI that enforces NetworkPolicy.
legacyNetworkPolicy:
  enabled: true
  gatewayNamespace: traefik
  gatewayPodLabels:
    app.kubernetes.io/name: traefik
