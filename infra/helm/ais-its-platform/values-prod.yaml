# =============================================================================
# ais-its-platform — PRODUCTION
# =============================================================================
#   helm upgrade --install ais-its infra/helm/ais-its-platform -n ais-its \
#     -f infra/helm/ais-its-platform/values-prod.yaml --atomic --timeout 10m
#
# Prerequisites (infra/helm/README.md): Traefik v3 with CRDs and a `websecure`
# entrypoint, the TLS secret, and the Secrets named by existingSecret
# (ais-its-shared, ais-its-auth, …) created from your secret manager. Backing
# services: managed PostgreSQL 17 + TimescaleDB, a 3-node NATS JetStream
# cluster, Valkey, S3 and SMTP — see infra/README.md "Production".

global:
  # Release of the nine services (kit 0.3 / contracts 0.4); web and legacy-be are
  # versioned on their own (pinned below). The replica counts and rolling updates
  # of this file need these images: coming from the 0.1.0 release, follow
  # "Upgrading from the 0.1.0 release" in infra/helm/README.md (notification first).
  imageTag: "0.2.0"
  existingSecret: ais-its-shared         # INTERNAL_TOKEN
  env:
    # Use tls://… once the NATS cluster serves TLS (infra/nats/nats.conf, production).
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://valkey:6379
    CORS_ORIGINS: https://ais-its.example.com
    PUBLIC_BASE_URL: https://ais-its.example.com
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318

x-http-service: &http-service
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 768Mi }

x-detector-service: &detector-service
  # One active instance (exclusive position consumer) + one hot standby that
  # takes over at once at a graceful stop, after the pinned TTL (30 s; safety:
  # DETECTOR_PINNED_TTL_MS) when the active Pod dies. Rolling updates (chart
  # default), PDB maxUnavailable 1.
  replicaCount: 2
  resources:
    requests: { cpu: 300m, memory: 384Mi }
    limits: { memory: 1Gi }

auth:
  <<: *http-service
  env:
    BOOTSTRAP_ADMIN_EMAIL: admin@ais-its.example.com
fleet: *http-service
telemetry: *http-service
# Stateless HTTP + transactional outbox (duplicates are harmless: the GEO stream
# keeps one message per zone and dedups by Nats-Msg-Id).
geo: *http-service

safety: *detector-service
surveillance: *detector-service

notification:
  # The replica that handles an alert event publishes the push on
  # aisits.notification.realtime.v1 and every replica emits it to its own
  # sockets (§9), so clients on any replica get every alert. Fixed count, no HPA:
  # a scale-down would only drop sockets (clients reconnect).
  replicaCount: 2
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 768Mi }

ais-ingestor:
  # Two instances keep the upstream feeds alive during a rollout or node loss;
  # duplicates are dropped by JetStream (Nats-Msg-Id dedup, spec §13.2).
  replicaCount: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 512Mi }

ais-processor:
  # One active AIS_RAW consumer (exclusive, per-vessel order) + one hot standby;
  # both serve the query API and relay the outbox.
  replicaCount: 2
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 1Gi }

emission:
  # Shared durable consumer; segments carry their own `previous`, handlers are idempotent.
  replicaCount: 2
  resources:
    requests: { cpu: 300m, memory: 384Mi }
    limits: { memory: 1Gi }

web:
  image:
    tag: "0.1.0"                         # ais-its-web release
  replicaCount: 2

martin:
  replicaCount: 2                        # image pinned in values.yaml

legacy-be:
  enabled: true                          # /api/v1 until the v2 cut-over (spec §1)
  image:
    tag: "0.1.0"                         # ais-its-mvp-api image as deployed so far
  replicaCount: 1                        # in-process schedulers of the MVP

gateway:
  hosts: [ais-its.example.com]
  entryPoints: [websecure]
  tls:
    enabled: true
    secretName: ais-its-tls
  hsts:
    enabled: true
    maxAgeSeconds: 31536000
  rateLimit:
    average: 10
    period: 1m
    burst: 10
    ipStrategyDepth: 0                   # 1 behind a single trusted cloud load balancer

legacyNetworkPolicy:
  enabled: true
  gatewayNamespace: traefik
