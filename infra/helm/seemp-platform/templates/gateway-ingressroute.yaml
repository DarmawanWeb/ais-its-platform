{{- /*
  One IngressRoute with every route of spec §12 (table: .Values.gateway.routes).
  A route is skipped when its backend component is disabled; a route without a
  backend is answered by Traefik itself (noop@internal behind deny-all → 403).
*/ -}}
{{- if .Values.gateway.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "seemp-platform.fullname" . }}
  labels:
    {{- include "seemp-platform.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.gateway.entryPoints | nindent 4 }}
  routes:
    {{- range .Values.gateway.routes }}
    {{- $component := dict }}
    {{- if .backend }}
    {{- $component = index $.Values .backend | default dict }}
    {{- end }}
    {{- if or (not .backend) $component.enabled }}
    # {{ .name }}
    - kind: Rule
      match: {{ include "seemp-platform.match" (dict "route" . "hosts" $.Values.gateway.hosts) | quote }}
      priority: {{ int .priority }}
      {{- with .middlewares }}
      middlewares:
        {{- range . }}
        - name: {{ include "seemp-platform.middleware" (list $ .) }}
        {{- end }}
      {{- end }}
      {{- if and (hasKey . "accessLogs") (not .accessLogs) }}
      observability:
        accessLogs: false
      {{- end }}
      services:
        {{- if .backend }}
        - name: {{ $component.fullnameOverride | default .backend }}
          port: {{ int (.port | default (($component.service).port | default $component.port)) }}
          {{- if .sticky }}
          sticky:
            cookie:
              name: {{ $.Values.gateway.stickyCookieName }}
              httpOnly: true
              secure: {{ $.Values.gateway.tls.enabled }}
              sameSite: lax
          {{- end }}
        {{- else }}
        - name: noop@internal
          kind: TraefikService
        {{- end }}
    {{- end }}
    {{- end }}
  {{- if .Values.gateway.tls.enabled }}
  tls:
    {{- with .Values.gateway.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
    {{- with .Values.gateway.tls.certResolver }}
    certResolver: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
