# =============================================================================
# seemp-platform — DEVELOPMENT cluster (kind / k3d / minikube / shared dev)
# =============================================================================
#   helm upgrade --install seemp infra/helm/seemp-platform -n seemp-dev \
#     --create-namespace -f infra/helm/seemp-platform/values-dev.yaml
#
# One replica each, small requests, plain HTTP on Traefik's `web` entrypoint at
# http://seemp.localtest.me (*.localtest.me resolves to 127.0.0.1). Backing
# services are expected in the same namespace under the compose hostnames of
# spec §3 (postgres, nats, valkey, s3, mailpit, observability).
#
# The credentials below are the public development defaults of spec §4/§6 and
# infra/compose/.env.example, rendered into chart-managed Secrets. Never use
# this file for anything reachable from outside a developer machine.

global:
  imageTag: main                         # images pushed by CI from the main branch
  existingSecret: ""
  env:
    LOG_LEVEL: debug
    CORS_ORIGINS: http://seemp.localtest.me
    PUBLIC_BASE_URL: http://seemp.localtest.me
    OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
    INTERNAL_TOKEN: dev-internal-token-change-me   # spec §4 dev default (Secret in prod)

x-dev-small: &small
  replicaCount: 1
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

auth:
  <<: *small
  env:
    COOKIE_SECURE: "false"               # plain HTTP in the dev cluster
  existingSecret: ""
  secretEnv:
    DATABASE_URL: postgres://auth_svc:auth_svc@postgres:5432/seemp
    KEY_ENCRYPTION_SECRET: dev-key-encryption-secret-32-chars-min
    BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!

fleet:
  <<: *small
  env:
    S3_PUBLIC_ENDPOINT: http://localhost:9000   # kubectl port-forward svc/s3 9000
  existingSecret: ""
  secretEnv:
    DATABASE_URL: postgres://fleet_svc:fleet_svc@postgres:5432/seemp
    S3_ACCESS_KEY: seemp-dev
    S3_SECRET_KEY: seemp-dev-secret

ais-ingestor:
  <<: *small
  existingSecret: ""
  secretEnv:
    AIS_UPSTREAM_TOKEN: ""

ais-processor:
  <<: *small
  existingSecret: ""
  secretEnv:
    DATABASE_URL: postgres://ais_svc:ais_svc@postgres:5432/seemp

telemetry:
  <<: *small
  existingSecret: ""
  secretEnv:
    DATABASE_URL: postgres://telemetry_svc:telemetry_svc@postgres:5432/seemp

emission:
  <<: *small
  existingSecret: ""
  secretEnv:
    DATABASE_URL: postgres://emission_svc:emission_svc@postgres:5432/seemp

detection:
  <<: *small
  existingSecret: ""
  secretEnv:
    DATABASE_URL: postgres://detection_svc:detection_svc@postgres:5432/seemp

notification:
  <<: *small
  env:
    SMTP_FROM: "SEEMP <no-reply@seemp.local>"
  existingSecret: ""
  secretEnv:
    DATABASE_URL: postgres://notify_svc:notify_svc@postgres:5432/seemp
    SMTP_URL: smtp://mailpit:1025
    TELEGRAM_BOT_TOKEN: ""
    WEBHOOK_SIGNING_SECRET: dev-webhook-signing-secret

web:
  replicaCount: 1

martin:
  replicaCount: 1
  existingSecret: ""
  secretEnv:
    DATABASE_URL: postgres://tiles_ro:tiles_ro@postgres:5432/seemp

legacy-be:
  enabled: false                         # enable together with a MongoDB in the namespace

gateway:
  hosts: [seemp.localtest.me]
  entryPoints: [web]
  tls:
    enabled: false
  rateLimit:                             # same as the compose gateway (e2e-friendly)
    average: 30
    period: 1m
    burst: 30
