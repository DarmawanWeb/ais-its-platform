apiVersion: v2
name: seemp-platform
description: >-
  SEEMP platform v2 on Kubernetes: every process of docs/PLATFORM_SPEC.md §1
  (one seemp-service instance each) plus the Traefik IngressRoute and
  Middlewares of the §12 gateway. Backing services (PostgreSQL + TimescaleDB,
  NATS JetStream, Valkey, S3, SMTP, OpenTelemetry) are provided separately.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/DarmawanWeb/seemp-platform
sources:
  - https://github.com/DarmawanWeb/seemp-platform/tree/main/infra/helm/seemp-platform
keywords: [seemp, cii, ais, traefik]
maintainers:
  - name: DarmawanWeb
# One alias per process; the alias is the component name, the Kubernetes
# Service name (fullnameOverride) and the compose hostname of spec §3.
dependencies:
  - name: seemp-service
    alias: auth
    version: 0.1.0
    repository: file://../seemp-service
    condition: auth.enabled
  - name: seemp-service
    alias: fleet
    version: 0.1.0
    repository: file://../seemp-service
    condition: fleet.enabled
  - name: seemp-service
    alias: ais-ingestor
    version: 0.1.0
    repository: file://../seemp-service
    condition: ais-ingestor.enabled
  - name: seemp-service
    alias: ais-processor
    version: 0.1.0
    repository: file://../seemp-service
    condition: ais-processor.enabled
  - name: seemp-service
    alias: telemetry
    version: 0.1.0
    repository: file://../seemp-service
    condition: telemetry.enabled
  - name: seemp-service
    alias: emission
    version: 0.1.0
    repository: file://../seemp-service
    condition: emission.enabled
  - name: seemp-service
    alias: detection
    version: 0.1.0
    repository: file://../seemp-service
    condition: detection.enabled
  - name: seemp-service
    alias: notification
    version: 0.1.0
    repository: file://../seemp-service
    condition: notification.enabled
  - name: seemp-service
    alias: web
    version: 0.1.0
    repository: file://../seemp-service
    condition: web.enabled
  - name: seemp-service
    alias: legacy-be
    version: 0.1.0
    repository: file://../seemp-service
    condition: legacy-be.enabled
  - name: seemp-service
    alias: martin
    version: 0.1.0
    repository: file://../seemp-service
    condition: martin.enabled
