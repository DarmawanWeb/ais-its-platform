{{- /*
  Non-secret environment: global.env (when platformEnv), then the process' own env. HOST and PORT
  are always derived from the chart (probes and Service depend on them);
  SERVICE_NAME defaults to the resource name (spec §4). Values are rendered
  with `tpl`, so one value can follow another instead of being copied, e.g.
  ALLOWED_ORIGINS: "{{ .Values.global.env.CORS_ORIGINS }}".
*/ -}}
{{- $env := dict "SERVICE_NAME" (include "ais-its-service.fullname" .) }}
{{- if .Values.platformEnv }}
{{- $env = mustMergeOverwrite $env (deepCopy ((.Values.global).env | default dict)) }}
{{- end }}
{{- $env = mustMergeOverwrite $env (deepCopy (.Values.env | default dict)) }}
{{- $_ := set $env "HOST" "0.0.0.0" }}
{{- $_ = set $env "PORT" (toString .Values.port) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ais-its-service.fullname" . }}
  labels:
    {{- include "ais-its-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $env }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
