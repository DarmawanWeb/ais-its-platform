{{- /* Chart-managed Secret for development values only; production uses existingSecret. */ -}}
{{- if and .Values.secretEnv (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ais-its-service.fullname" . }}
  labels:
    {{- include "ais-its-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
