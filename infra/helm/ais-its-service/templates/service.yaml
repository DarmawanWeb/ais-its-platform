apiVersion: v1
kind: Service
metadata:
  name: {{ include "ais-its-service.fullname" . }}
  labels:
    {{- include "ais-its-service.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ais-its-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port | default .Values.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
    {{- if .Values.secondaryContainer.enabled }}
    - name: {{ include "ais-its-service.secondaryPortName" . }}
      port: {{ .Values.secondaryContainer.port }}
      targetPort: {{ include "ais-its-service.secondaryPortName" . }}
      protocol: TCP
      appProtocol: http
    {{- end }}
