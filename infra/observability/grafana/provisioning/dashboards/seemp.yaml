# Grafana dashboard provider for the SEEMP dashboards (mounted next to the
# image's own providers in /otel-lgtm/grafana/conf/provisioning/dashboards/).
apiVersion: 1

providers:
  - name: SEEMP
    folder: SEEMP
    type: file
    disableDeletion: true
    allowUiUpdates: true          # experiment freely; the JSON in git stays the source
    updateIntervalSeconds: 30     # edits to the mounted JSON show up without a restart
    options:
      path: /otel-lgtm/seemp/grafana/dashboards
      foldersFromFilesStructure: false
