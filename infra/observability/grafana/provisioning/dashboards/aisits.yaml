# Grafana dashboard provider for the AIS Maritime Intelligence dashboards
# (mounted next to the image's own providers in
# /otel-lgtm/grafana/conf/provisioning/dashboards/).
apiVersion: 1

providers:
  - name: AIS Maritime Intelligence
    folder: AIS Maritime Intelligence
    type: file
    disableDeletion: true
    allowUiUpdates: true          # experiment freely; the JSON in git stays the source
    updateIntervalSeconds: 30     # edits to the mounted JSON show up without a restart
    options:
      path: /otel-lgtm/aisits/grafana/dashboards
      foldersFromFilesStructure: false
