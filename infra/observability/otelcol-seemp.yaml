# =============================================================================
# SEEMP — OpenTelemetry Collector overlay for grafana/otel-lgtm
# =============================================================================
# Merged on top of the image's own /otel-lgtm/otelcol-config.yaml through
# OTELCOL_EXTRA_ARGS=--config=file:/otel-lgtm/seemp/otelcol-seemp.yaml (maps are
# merged, lists replaced). It adds a Prometheus scrape of every service's
# GET /metrics (prom-client, spec §10) and of the gateway, and feeds the result
# into the existing metrics pipeline → Prometheus inside the container.
#
# Dev mode: services run on the host with `pnpm dev`, so targets are
# host.docker.internal:<port> (spec §3); a stopped service simply reports
# up == 0. The Prometheus `job` label is the service name used by the
# "SEEMP overview" dashboard.

receivers:
  prometheus/seemp:
    config:
      global:
        scrape_interval: 15s
        scrape_timeout: 5s
      scrape_configs:
        - job_name: auth
          static_configs: [{ targets: ["host.docker.internal:3001"] }]
        - job_name: fleet
          static_configs: [{ targets: ["host.docker.internal:3002"] }]
        - job_name: ais-ingestor
          static_configs: [{ targets: ["host.docker.internal:3003"] }]
        - job_name: ais-processor
          static_configs: [{ targets: ["host.docker.internal:3004"] }]
        - job_name: telemetry
          static_configs: [{ targets: ["host.docker.internal:3005"] }]
        - job_name: emission
          static_configs: [{ targets: ["host.docker.internal:3006"] }]
        - job_name: detection
          static_configs: [{ targets: ["host.docker.internal:3007"] }]
        - job_name: notification
          static_configs: [{ targets: ["host.docker.internal:3008"] }]
        - job_name: gateway                  # Traefik, compose network
          static_configs: [{ targets: ["gateway:8090"] }]

service:
  pipelines:
    metrics:
      # The image's receivers (OTLP + collector self-metrics) plus ours.
      receivers: [otlp, prometheus/collector, prometheus/seemp]
